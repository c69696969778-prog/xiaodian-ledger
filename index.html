function sum(rows,key='cents'){return rows.reduce((s,x)=>s+x[key],0)}
function inRange(date,s=state.start,e=state.end){return date>=s&&date<=e}
function daysList(s=state.start,e=state.end){const out=[];for(let d=s;d<=e;d=shift(d,1)){out.push(d);if(out.length>366)break}return out}
function expensePart(x,s,e,mode=state.mode){if(mode==='cash')return inRange(x.date,s,e)?x.cents:0;let a=x.start||x.date,b=x.end||x.date,total=diff(b,a)+1;let before=Math.max(0,Math.min(total,diff(s,a))),through=Math.max(0,Math.min(total,diff(e,a)+1));return Math.round(x.cents*through/total)-Math.round(x.cents*before/total)}
function stats(s=state.start,e=state.end){const income=db.records.filter(x=>x.type==='income'),exp=db.records.filter(x=>x.type==='expense');let revenue=sum(income.filter(x=>inRange(x.date,s,e))),receipts=sum(income.filter(x=>x.ch==='sign'?x.paidDate&&inRange(x.paidDate,s,e):inRange(x.date,s,e))),cost=exp.reduce((v,x)=>v+expensePart(x,s,e),0);return {revenue,receipts,cost,profit:revenue-cost,cashCost:sum(exp.filter(x=>inRange(x.date,s,e)))}}
function openSigns(asof=state.end){return db.records.filter(x=>x.ch==='sign'&&x.date<=asof&&(!x.paidDate||x.paidDate>asof))}
function ageGroup(x){let a=diff(state.end,x.date);return a<=30?'0':a<=90?'1':'2'}
function persist(){db.updated=new Date().toISOString();try{localStorage.setItem(STORE,JSON.stringify(db));storageOK=true}catch(e){storageOK=false}updateSave()}
function updateSave(){$('savestate').innerHTML='<span class="dot"></span>'+(storageOK?'已保存至本机':'未能保存 · 请导出备份');$('savestate').style.color=storageOK?'#6b8d80':'#bd4954'}
function change(mutator,message){undoStack.push(JSON.stringify(db));if(undoStack.length>20)undoStack.shift();mutator();persist();render();notify(message,true)}
function undo(){const old=undoStack.pop();if(!old)return;db=JSON.parse(old);persist();render();notify('已撤销上一步操作')}
function notify(message,canUndo=false){clearTimeout(toastTimer);$('toast').hidden=false;$('toast').className='toast';$('toast').innerHTML='<span>'+esc(message)+(storageOK?'':'；本地保存失败，请导出备份')+'</span>'+(canUndo?'<button onclick="undo()">撤销</button>':'')+'<button aria-label="关闭提示" onclick="hideToast()">×</button>';toastTimer=setTimeout(hideToast,10000)}
function hideToast(){$('toast').hidden=true}
const pages=[['overview','经营总览'],['ledger','收支流水'],['ar','签字单应收'],['attendance','员工考勤'],['reports','经营报告']];
function go(page){state.page=page;state.index=1;state.query='';state.type='all';state.channel='all';state.status='all';render();window.scrollTo?.({top:0,behavior:'smooth'})}
function render(){const title=pages.find(p=>p[0]===state.page)[1];$('crumb').textContent=title;$('navigation').innerHTML=pages.map(([k,n])=>'<button title="'+n+'" aria-label="'+n+'" '+(state.page===k?'aria-current="page"':'')+' class="'+(state.page===k?'active':'')+'" onclick="go(\''+k+'\')">'+icon(k)+'<span>'+n+'</span>'+(k==='ar'?'<span class="badge">'+openSigns().length+'</span>':'')+'</button>').join('');const subtitles={overview:'把收入、成本和待收款，放在同一张经营地图里。',ledger:'每一笔收入与支出，都有迹可循。',ar:'按客户查看欠款，按账龄安排跟进。',attendance:'记录请假与顶班，查看实际未覆盖的缺勤。',reports:'从数字到结论，为下一步经营提供参考。'};let actions=state.page==='attendance'?'<button class="primary" onclick="openAttendance()">'+icon('plus')+' 录入请假</button>':'<button onclick="exportCurrent()">'+icon('download')+' 导出</button><button class="primary" onclick="openEntry()">'+icon('plus')+' 记一笔</button>';$('app').innerHTML='<div class="pagehead"><div><h1>'+title+'</h1><p class="muted small">'+subtitles[state.page]+'</p></div><div class="actions">'+actions+'</div></div>'+(state.page==='attendance'?'':toolbar())+({overview:overview,ledger:ledger,ar:receivables,attendance:attendance,reports:reports}[state.page])();updateSave()}
function toolbar(){return '<div class="toolbar"><div class="datebar"><div class="segment">'+[['day','当日'],['week','近7天'],['month','当月']].map(([k,n])=>'<button class="'+(state.range===k?'active':'')+'" onclick="range(\''+k+'\')">'+n+'</button>').join('')+'</div><div class="datecontrol">'+icon('calendar')+'<input aria-label="开始日期" type="date" value="'+state.start+'" onchange="setDate(\'start\',this.value)"><span class="muted small">—</span><input aria-label="结束日期" type="date" value="'+state.end+'" onchange="setDate(\'end\',this.value)"></div></div><div class="mode">支出口径 <select aria-label="支出计算口径" onchange="state.mode=this.value;render()"><option value="amort" '+(state.mode==='amort'?'selected':'')+'>按使用期分摊</option><option value="cash" '+(state.mode==='cash'?'selected':'')+'>按实际付款</option></select><button class="text" aria-label="查看指标定义" onclick="showHelp()"><span class="help">?</span></button></div></div>'}
function range(k){state.range=k;state.start=k==='day'?state.end:k==='week'?shift(state.end,-6):monthStart(state.end);state.index=1;render()}
function setDate(key,v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){render();return}let next={...state,[key]:v};if(next.start>next.end||diff(next.end,next.start)>365){notify('请选择起止顺序正确、跨度不超过366天的日期');render();return}state[key]=v;state.range='custom';state.index=1;render()}
function metric(label,value,hint,k,klass=''){return '<div class="card metric"><span class="label">'+label+'</span><div class="miniicon">'+icon(k)+'</div><div class="value '+klass+'">'+fmt(value)+'</div><div class="hint">'+hint+'</div></div>'}
function metrics(){let s=stats(),unreceived=sum(db.records.filter(x=>x.ch==='sign'&&inRange(x.date)&&(!x.paidDate||x.paidDate>state.end)));return '<div class="metrics">'+metric('期间营收',s.revenue,'含期间签字单；尚未收款 '+fmt(unreceived),'money','teal')+metric('期间实收',s.receipts,'按收款日期计入，含历史签字单回款','wallet')+metric('期间支出',s.cost,state.mode==='amort'?'按费用使用期分摊至所选期间':'按实际付款日期计入','ledger')+metric('估算经营结余',s.profit,'结余率 '+(s.revenue?(s.profit/s.revenue*100).toFixed(1):'0.0')+'% · 以已记录费用为准','profit',s.profit<0?'negative':'')+'</div>'}
function cardHead(title,sub='',extra=''){return '<div class="cardhead"><div><h2>'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+extra+'</div>'}
function overview(){const open=openSigns(),old=open.filter(x=>diff(state.end,x.date)>90);let banner='<div class="insight">'+icon('spark')+'<p><b>待收款 '+fmt(sum(open))+'</b>，其中 '+old.length+' 笔账龄超过90天，合计 '+fmt(sum(old))+'。<span class="muted"> 账龄按签单日计算，未设置到期日，不代表已逾期。</span></p><button class="text" onclick="go(\'ar\')">查看应收 '+icon('arrow')+'</button></div>';return banner+metrics()+'<div class="grid"><div class="card">'+cardHead('营收与经营结余','所选期间 · 单位：元','<div class="legend"><span><i></i>营收</span><span><i class="line"></i>经营结余</span></div>')+trend()+'</div><div class="card">'+cardHead('收入渠道','按收入发生日期统计')+channels()+'</div></div><div class="grid equal"><div class="card">'+cardHead('支出结构',state.mode==='amort'?'按使用期分摊 · 所选期间':'按实际付款 · 所选期间')+costBars()+'</div><div class="card">'+cardHead('近期流水','所选期间最新6笔','<button class="text small" onclick="go(\'ledger\')">查看全部 '+icon('arrow')+'</button>')+'<div class="tablewrap">'+recordsTable(db.records.filter(x=>inRange(x.date)).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,6),false)+'</div></div></div>'}
function trend(){let dates=daysList(),group=Math.max(1,Math.ceil(dates.length/31)),points=[];for(let i=0;i<dates.length;i+=group){let end=dates[Math.min(i+group-1,dates.length-1)],s=stats(dates[i],end);points.push({date:dates[i],end,...s})}let W=720,H=245,left=48,right=12,top=15,bottom=32,pw=W-left-right,ph=H-top-bottom,max=Math.max(100,...points.flatMap(x=>[x.revenue,x.profit]))/100,min=Math.min(0,...points.map(x=>x.profit))/100;max=Math.ceil(max/500)*500;min=Math.floor(min/500)*500;const y=v=>top+(max-v)/(max-min)*ph,slot=pw/Math.max(points.length,1),bw=Math.min(22,slot*.58);let svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="所选期间营收柱状图和经营结余折线图。详细数字可在经营报告中导出。">';for(let i=0;i<5;i++){let v=min+(max-min)*i/4;svg+='<line class="plot" x1="'+left+'" y1="'+y(v)+'" x2="'+(W-right)+'" y2="'+y(v)+'"/><text x="'+(left-9)+'" y="'+(y(v)+4)+'" text-anchor="end">'+Math.round(v).toLocaleString()+'</text>'}svg+='<line x1="'+left+'" y1="'+y(0)+'" x2="'+(W-right)+'" y2="'+y(0)+'" stroke="#dce4eb"/>';points.forEach((x,i)=>{let cx=left+slot*(i+.5),v=x.revenue/100;svg+='<rect x="'+(cx-bw/2)+'" y="'+y(v)+'" width="'+bw+'" height="'+Math.max(0,y(0)-y(v))+'" rx="2" fill="#168578" opacity=".8"><title>'+esc(x.date+(x.end!==x.date?' 至 '+x.end:'')+' 营收 '+fmt(x.revenue,true)+'；结余 '+fmt(x.profit,true))+'</title></rect>';if(i===0||i===points.length-1||i%Math.max(1,Math.ceil(points.length/7))===0)svg+='<text x="'+cx+'" y="'+(H-9)+'" text-anchor="middle">'+x.date.slice(5).replace('-','/')+'</text>'});let coords=points.map((x,i)=>[left+slot*(i+.5),y(x.profit/100)]);svg+='<polyline points="'+coords.map(x=>x.join(',')).join(' ')+'" fill="none" stroke="#d56d43" stroke-width="2.2" stroke-linejoin="round"/>';coords.forEach(([x,y],i)=>{svg+='<circle cx="'+x+'" cy="'+y+'" r="2.2" fill="#d56d43"><title>'+esc(points[i].date+' 结余 '+fmt(points[i].profit,true))+'</title></circle>'});return svg+'</svg>'}
function channels(){let rows=Object.entries(names).map(([ch,name])=>({ch,name,cents:sum(db.records.filter(x=>x.type==='income'&&x.ch===ch&&inRange(x.date)))})),total=sum(rows);return rows.map((x,i)=>'<div class="channelrow"><div class="channelmeta"><span>'+x.name+'</span><strong>'+fmt(x.cents)+'<small>'+(total?(x.cents/total*100).toFixed(1):'0.0')+'%</small></strong></div><div class="track"><span style="width:'+(total?x.cents/total*100:0)+'%;background:'+colors[i]+'"></span></div></div>').join('')+'<div class="totalrow"><span class="muted">渠道营收合计</span><b>'+fmt(total)+'</b></div>'}
function costBars(){let rows=cats.map(category=>({category,cents:db.records.filter(x=>x.type==='expense'&&x.category===category).reduce((v,x)=>v+expensePart(x,state.start,state.end),0)})).sort((a,b)=>b.cents-a.cents),max=Math.max(1,...rows.map(x=>x.cents)),total=sum(rows);return rows.map((x,i)=>'<div class="progressrow"><span>'+x.category+'</span><div class="track"><span style="width:'+x.cents/max*100+'%;background:'+(i===0?'#dc8059':'#e9bda7')+'"></span></div><span class="num">'+fmt(x.cents)+'</span></div>').join('')+'<div class="totalrow"><span class="muted">支出合计</span><b>'+fmt(total)+'</b></div>'}
function selectedRecords(){let q=state.query.trim().toLowerCase();return db.records.filter(x=>inRange(x.date)&&(state.type==='all'||x.type===state.type)&&(state.channel==='all'||x.ch===state.channel||x.category===state.channel)&&(state.status==='all'||(state.status==='open'?x.ch==='sign'&&(!x.paidDate||x.paidDate>state.end):x.ch!=='sign'||x.paidDate&&x.paidDate<=state.end))&&(!q||[x.client,x.person,x.category,names[x.ch],x.note,x.date].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))}
function statusTag(x){return x.ch==='sign'?x.paidDate&&x.paidDate<=state.end?'<span class="tag green">已结清</span>':'<span class="tag amber">未结清</span>':'<span class="tag">已记录</span>'}
function recordsTable(rows,full=true){let h='<table><thead><tr><th>日期</th><th>项目</th><th class="num">金额</th><th>状态</th>'+(full?'<th>备注 / 客户</th><th class="num">操作</th>':'')+'</tr></thead><tbody>';if(!rows.length)return h+'<tr><td colspan="'+(full?6:4)+'" class="empty">暂无匹配记录，试试调整筛选条件。</td></tr></tbody></table>';return h+rows.map(x=>'<tr class="rowfocus"><td>'+x.date.slice(full?0:5)+'</td><td><span class="tag '+(x.type==='income'?'green':'')+'">'+(x.type==='income'?'收入':'支出')+'</span> '+esc(x.category||names[x.ch])+'</td><td class="num '+(x.type==='income'?'positive':'negative')+'">'+(x.type==='income'?'+':'−')+fmt(x.cents,full)+'</td><td>'+statusTag(x)+'</td>'+(full?'<td style="max-width:220px;white-space:normal">'+esc(x.client?x.client+' / '+x.person:x.note||'—')+'</td><td class="num"><button class="text small" onclick="viewRecord(\''+x.id+'\')">详情</button></td>':'')+'</tr>').join('')+'</tbody></table>'}
function options(list,value){return list.map(([v,n])=>'<option value="'+esc(v)+'" '+(value===v?'selected':'')+'>'+esc(n)+'</option>').join('')}
function ledger(){let rows=selectedRecords(),n=Math.ceil(rows.length/15);state.index=Math.max(1,Math.min(state.index,n||1));return '<div class="card">'+cardHead('收支明细','每次录入独立成笔；签字单回款不重复增加营收')+'<div class="filters"><input id="ledgerSearch" aria-label="搜索流水" placeholder="搜索项目、客户、姓名或备注" value="'+esc(state.query)+'" oninput="searchLedger(this)"><select aria-label="流水类型" onchange="filter(\'type\',this.value)">'+options([['all','全部收支'],['income','收入'],['expense','支出']],state.type)+'</select><select aria-label="收入渠道或费用类别" onchange="filter(\'channel\',this.value)">'+options([['all','全部项目'],...Object.entries(names),...cats.map(x=>[x,x])],state.channel)+'</select><select aria-label="收款状态" onchange="filter(\'status\',this.value)">'+options([['all','全部状态'],['open','未结清'],['paid','已收款 / 已记录']],state.status)+'</select><button class="text small" onclick="clearFilters()">重置</button></div><div class="statstrip"><span>匹配笔数<b>'+rows.length+' 笔</b></span><span>收入金额<b class="positive">'+fmt(sum(rows.filter(x=>x.type==='income')),true)+'</b></span><span>支出金额（付款）<b>'+fmt(sum(rows.filter(x=>x.type==='expense')),true)+'</b></span></div><div class="tablewrap">'+recordsTable(rows.slice((state.index-1)*15,state.index*15))+'</div><div class="paging"><span>共 '+rows.length+' 笔 · 每页15笔</span><div class="actions"><button '+(state.index===1?'disabled':'')+' onclick="state.index--;render()">上一页</button><span style="padding:7px">'+state.index+' / '+(n||1)+'</span><button '+(state.index>=n?'disabled':'')+' onclick="state.index++;render()">下一页</button></div></div></div>'}
function searchLedger(input){let pos=input.selectionStart;state.query=input.value;state.index=1;render();const next=$('ledgerSearch');next.focus();next.setSelectionRange?.(pos,pos)}
function filter(k,v){state[k]=v;state.index=1;render()}
function clearFilters(){Object.assign(state,{query:'',type:'all',channel:'all',status:'all',index:1});render()}
function signRows(){return db.records.filter(x=>x.ch==='sign'&&x.date<=state.end&&(state.arStatus==='all'||(state.arStatus==='open'?(!x.paidDate||x.paidDate>state.end):x.paidDate&&x.paidDate<=state.end))&&(state.aging==='all'||ageGroup(x)===state.aging)&&(!state.client||x.client===state.client)).sort((a,b)=>a.date.localeCompare(b.date))}
function receivables(){let open=openSigns(),rows=signRows(),groups=new Map;open.forEach(x=>{let v=groups.get(x.client)||{cents:0,count:0,oldest:0};v.cents+=x.cents;v.count++;v.oldest=Math.max(v.oldest,diff(state.end,x.date));groups.set(x.client,v)});let aging=[['all','未结总额',open],['0','0–30天',open.filter(x=>ageGroup(x)==='0')],['1','31–90天',open.filter(x=>ageGroup(x)==='1')],['2','90天以上',open.filter(x=>ageGroup(x)==='2')]];return '<div class="insight">'+icon('ar')+'<p>应收余额截至 <b>'+state.end+'</b>，包含历史未结签字单，不受开始日期限制。<br><span class="muted">账龄从签单日计算。原示例没有约定到期日，因此这里不把“账龄较长”直接判定为“逾期”。</span></p></div><div class="aging">'+aging.map(([k,n,l])=>'<button class="'+(state.aging===k?'active':'')+'" onclick="state.aging=\''+k+'\';state.arStatus=\'open\';render()"><small>'+n+'</small><strong '+(k==='2'?'class="negative"':'')+'>'+fmt(sum(l))+'</strong><small>'+l.length+' 笔 · 点击查看</small></button>').join('')+'</div><div class="card" style="margin-bottom:20px">'+cardHead('客户欠款汇总','点击客户，查看对应签字单')+'<div class="tablewrap"><table><thead><tr><th>客户单位</th><th class="num">未结金额</th><th class="num">笔数</th><th>最早账龄</th><th class="num">操作</th></tr></thead><tbody>'+([...groups.entries()].sort((a,b)=>b[1].cents-a[1].cents).map(([n,v])=>'<tr><td><button class="clientbtn" data-client="'+esc(n)+'" onclick="selectClient(this.dataset.client)">'+esc(n)+'</button></td><td class="num">'+fmt(v.cents,true)+'</td><td class="num">'+v.count+'</td><td><span class="tag '+(v.oldest>90?'amber':'')+'">'+v.oldest+' 天</span></td><td class="num"><button class="text small" data-client="'+esc(n)+'" onclick="exportClient(this.dataset.client)">导出对账单</button></td></tr>').join('')||'<tr><td colspan="5" class="empty">截至此日期没有待收款</td></tr>')+'</tbody></table></div></div><div class="card" id="signDetail">'+cardHead('签字单明细','每张签字单保留独立记录')+'<div class="filters"><select aria-label="筛选客户" onchange="state.client=this.value;render()">'+options([['','全部客户'],...[...new Set(db.records.filter(x=>x.ch==='sign').map(x=>x.client))].map(n= function validBackup(v){if(!v||v.version!==1||!Array.isArray(v.records)||!Array.isArray(v.attendance)||v.records.length>100000||v.attendance.length>100000)return false;const ids=new Set;for(const x of v.records){if(!x||typeof x.id!=='string'||!/^[a-zA-Z0-9-]{1,90}$/.test(x.id)||ids.has(x.id)||!validDate(x.date)||!Number.isSafeInteger(x.cents)||x.cents<=0||x.cents>99999999900||typeof x.note!=='string'||x.note.length>500)return false;ids.add(x.id);if(x.type==='income'){if(!Object.hasOwn(names,x.ch))return false;if(x.ch==='sign'&&(typeof x.client!=='string'||!x.client.trim()||typeof x.person!=='string'||!x.person.trim()||(x.paidDate!==null&&(!validDate(x.paidDate)||x.paidDate<x.date))))return false}else if(x.type==='expense'){if(!cats.includes(x.category)||!validDate(x.start)||!validDate(x.end)||x.start>x.end||diff(x.end,x.start)>3650)return false}else return false}for(const x of v.attendance){if(!x||typeof x.id!=='string'||!/^[a-zA-Z0-9-]{1,90}$/.test(x.id)||ids.has(x.id)||typeof x.name!=='string'||!x.name.trim()||!validDate(x.date)||!Number.isFinite(x.days)||x.days<.5||x.days>366||x.days*2%1||typeof x.covered!=='boolean'||typeof x.cover!=='string')return false;ids.add(x.id)}return true}
async function importBackup(input){const file=input.files[0];if(!file)return;if(file.size>20*1024*1024)return notify('备份文件超过20MB，无法导入');try{let imported=JSON.parse(await file.text());if(!validBackup(imported))throw Error('invalid');showOverlay('<h2>恢复账本备份</h2><p class="small muted" style="line-height:2;margin-bottom:20px">文件包含 '+imported.records.length+' 笔流水、'+imported.attendance.length+' 条考勤。恢复将替换当前账本，可在恢复后撤销。建议先导出当前账本备份。</p><div class="actions"><button onclick="downloadBackup()">先导出当前备份</button><button onclick="closeOverlay()">取消</button><button class="primary" id="confirmRestore">恢复此备份</button></div>',false);$('confirmRestore').onclick=()=>{change(()=>db=imported,'已恢复备份');closeOverlay()}}catch(e){notify('备份格式无效，请选择本改版导出的完整JSON备份')}input.value=''}
// 无外部依赖的 Office Open XML 导出；ZIP 使用存储模式，金额单元格为数值。
function xml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'')}
function crc32(bytes){let c=0xffffffff;for(let b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0}
function zip(files){const enc=new TextEncoder,parts=[],central=[];let offset=0;for(const [name,content] of Object.entries(files)){let n=enc.encode(name),b=enc.encode(content),crc=crc32(b),head=new Uint8Array(30+n.length),v=new DataView(head.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint16(12,33,true);v.setUint32(14,crc,true);v.setUint32(18,b.length,true);v.setUint32(22,b.length,true);v.setUint16(26,n.length,true);head.set(n,30);let cd=new Uint8Array(46+n.length),d=new DataView(cd.buffer);d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x800,true);d.setUint16(14,33,true);d.setUint32(16,crc,true);d.setUint32(20,b.length,true);d.setUint32(24,b.length,true);d.setUint16(28,n.length,true);d.setUint32(42,offset,true);cd.set(n,46);parts.push(head,b);central.push(cd);offset+=head.length+b.length}let size=central.reduce((a,b)=>a+b.length,0),end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,central.length,true);e.setUint16(10,central.length,true);e.setUint32(12,size,true);e.setUint32(16,offset,true);return new Blob([...parts,...central,end])}
function colName(n){let r='';for(n++;n;n=Math.floor((n-1)/26))r=String.fromCharCode(65+(n-1)%26)+r;return r}
function workbook(sheets){let types='',sheetlist='',rels='',files={},base='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main';sheets.forEach(([name,rows],i)=>{let id=i+1;types+='<Override PartName="/xl/worksheets/sheet'+id+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';sheetlist+='<sheet name="'+xml(name)+'" sheetId="'+id+'" r:id="rId'+id+'"/>';rels+='<Relationship Id="rId'+id+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+id+'.xml"/>';let data=rows.map((row,r)=>'<row r="'+(r+1)+'">'+row.map((v,c)=>{let ref=colName(c)+(r+1);return typeof v==='number'?'<c r="'+ref+'" s="2"><v>'+v+'</v></c>':'<c r="'+ref+'" t="inlineStr" s="'+(r===0?1:0)+'"><is><t xml:space="preserve">'+xml(v??'')+'</t></is></c>'}).join('')+'</row>').join('');files['xl/worksheets/sheet'+id+'.xml']=base+'<worksheet xmlns="'+ns+'"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="'+Math.max(1,...rows.map(x=>x.length))+'" width="20" customWidth="1"/></cols><sheetData>'+data+'</sheetData></worksheet>'});files['[Content_Types].xml']=base+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+types+'</Types>';files['_rels/.rels']=base+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';files['xl/workbook.xml']=base+'<workbook xmlns="'+ns+'" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheetlist+'</sheets></workbook>';files['xl/_rels/workbook.xml.rels']=base+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels+'<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';files['xl/styles.xml']=base+'<styleSheet xmlns="'+ns+'"><fonts count="2"><font><sz val="11"/><name val="Microsoft YaHei"/></font><font><b/><sz val="11"/><name val="Microsoft YaHei"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';return zip(files)}
function saveWorkbook(sheets,name){download(workbook(sheets),name+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');notify('已生成Excel文件，请保存下载文件')}
function ledgerSheet(rows){return [['日期','类型','项目','金额（元）','客户单位','姓名','状态','收款日期','费用覆盖开始','费用覆盖结束','备注'],...rows.map(x=>[x.date,x.type==='income'?'收入':'支出',x.category||names[x.ch],x.cents/100,x.client||'',x.person||'',x.ch==='sign'?(x.paidDate?'已结清':'未结清'):'已记录',x.paidDate||'',x.start||'',x.end||'',x.note||''])]}
function exportOverview(){let daily=daysList().map(d=>{let s=stats(d,d);return [d,s.revenue/100,s.receipts/100,s.cost/100,s.profit/100]}),rows=db.records.filter(x=>inRange(x.date));saveWorkbook([['每日经营汇总',[['日期','营收（元）','实收（元）','支出（元）','估算经营结余（元）'],...daily]],['收支流水',ledgerSheet(rows)],['口径说明',[['项目','说明'],['日期范围',state.start+' 至 '+state.end],['支出口径',state.mode==='amort'?'按使用期分摊':'按实际付款'],['营收','按发生日，包括未结签字单'],['实收','签字单按实际收款日，其余渠道按录入日'],['经营结余','营收减已记录费用，并非完整净利润'],['示例数据','2026年10月示例账本']]]],'经营报表_'+state.start+'_'+state.end)}
function signSheets(rows,asof=null){return [['已结清',true],['未结清',false]].map(([n,paid])=>{let r=rows.filter(x=>!!(x.paidDate&&(!asof||x.paidDate<=asof))===paid).sort((a,b)=>a.client.localeCompare(b.client,'zh-CN')||a.person.localeCompare(b.person,'zh-CN')||a.date.localeCompare(b.date));return [n,[['工作单位','姓名','金额（元）','签单日期','收款日期'],...r.map(x=>[x.client,x.person,x.cents/100,x.date,paid?x.paidDate:'']),['合计（'+r.length+'笔）','',sum(r)/100,'','']]]})}
function exportSigns(){let mode=$('exportPeriodMode').value,v=$('exportPeriod').value,s,e;if(mode==='y'){if(!/^\d{4}$/.test(v)||+v<1900||+v>2200)return notify('请输入1900至2200之间的年份');s=v+'-01-01';e=v+'-12-31'}else{if(!/^\d{4}-\d{2}$/.test(v)||!validDate(v+'-01'))return notify('请选择有效月份');s=v+'-01';let date=new Date(parseDate(s));date.setUTCMonth(date.getUTCMonth()+(mode==='q'?3:1));e=iso(date.getTime()-DAY)}let rows=db.records.filter(x=>x.ch==='sign'&&inRange(x.date,s,e));saveWorkbook(signSheets(rows),'签字单_'+s+'_'+e)}
function exportClient(client){let rows=db.records.filter(x=>x.ch==='sign'&&x.client===client&&x.date<=state.end);saveWorkbook(signSheets(rows,state.end),'客户对账单_'+client.replace(/[\\/:*?"<>|]/g,'_')+'_'+state.end)}
function exportAttendance(){let rows=db.attendance.filter(x=>x.date.startsWith(state.attMonth));saveWorkbook([['考勤明细',[['日期','姓名','请假天数','是否顶班','顶班人','计入缺勤天数'],...rows.map(x=>[x.date,x.name,x.days,x.covered?'是':'否',x.cover,x.covered?0:x.days])]]],'员工考勤_'+state.attMonth)}
function exportCurrent(){if(state.page==='ledger')saveWorkbook([['收支流水',ledgerSheet(selectedRecords())]],'收支流水_'+state.start+'_'+state.end);else if(state.page==='ar')saveWorkbook(signSheets(signRows(),state.end),'签字单应收_'+state.end);else exportOverview()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeOverlay();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();undo()}if(e.key==='Tab'&&!$('overlay').hidden){let f=[...$('overlay').querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled&&!x.hidden&&x.getClientRects().length),first=f[0],last=f[f.length-1];if(!first)return;if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
